apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # Jump from a span to the log lines that carry the same trace id.
      tracesToLogsV2:
        datasourceUid: elasticsearch
        filterByTraceID: true
        customQuery: true
        query: 'trace_id:"$${__trace.traceId}"'

  - name: Elasticsearch
    uid: elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: dotnet-logs-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: level
      dataLinks:
        - field: trace_id
          datasourceUid: jaeger
          url: "$${__value.raw}"
