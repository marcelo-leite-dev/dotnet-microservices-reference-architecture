# Receives Serilog batches (compact JSON, one array per request) from the services' HTTP sink
# and indexes them into Elasticsearch with friendlier field names.

input {
  http {
    port => 8080
    codec => json   # a JSON array becomes one event per element
  }
}

filter {
  # Serilog compact JSON (CLEF) -> readable fields.
  date {
    match  => ["@t", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    rename => {
      "@m"  => "message"
      "@mt" => "message_template"
      "@l"  => "level"
      "@x"  => "exception"
      "@tr" => "trace_id"
      "@sp" => "span_id"
    }
    # Drop the HTTP transport metadata added by the input plugin.
    remove_field => ["@t", "@i", "@r", "headers", "http", "url", "user_agent", "host", "event"]
  }

  # CLEF omits the level for Information events.
  if ![level] {
    mutate { add_field => { "level" => "Information" } }
  }
}

output {
  elasticsearch {
    hosts       => ["http://elasticsearch:9200"]
    # Not "logs-*": that pattern is reserved for data streams by Elasticsearch's built-in templates.
    index       => "dotnet-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
