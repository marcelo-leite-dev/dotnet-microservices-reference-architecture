global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics arrive via OTLP at the collector, which exposes them for scraping.
  # The `job` label of each series is the OpenTelemetry service.name (catalog-api, ordering-api).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
