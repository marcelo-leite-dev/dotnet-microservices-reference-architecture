apiVersion: v1
kind: ServiceAccount
metadata:
  name: ordering-api
  annotations:
    azure.workload.identity/client-id: <ORDERING_API_MANAGED_IDENTITY_CLIENT_ID>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
spec:
  replicas: 3
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      # Workload Identity needs the projected service account token.
      automountServiceAccountToken: true
      containers:
        - name: api
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: ordering-api-secrets
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ordering-api
spec:
  minReplicas: 3
  maxReplicas: 10
