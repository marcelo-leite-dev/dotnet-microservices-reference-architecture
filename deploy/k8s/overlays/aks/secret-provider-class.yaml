# Pulls secrets from Azure Key Vault (authenticating with Workload Identity, no stored credentials)
# and mirrors them into Kubernetes Secrets consumed by the Deployments via `envFrom`.
# The Secret is created when a pod mounts the CSI volume (see patches/*-api.yaml).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: catalog-api-secrets
spec:
  provider: azure
  parameters:
    clientID: <CATALOG_API_MANAGED_IDENTITY_CLIENT_ID>
    keyvaultName: <KEY_VAULT_NAME>
    tenantId: <AZURE_TENANT_ID>
    objects: |
      array:
        - |
          objectName: catalog-db-connection-string
          objectType: secret
        - |
          objectName: redis-connection-string
          objectType: secret
        - |
          objectName: event-hubs-connection-string
          objectType: secret
  secretObjects:
    - secretName: catalog-api-secrets
      type: Opaque
      data:
        - objectName: catalog-db-connection-string
          key: ConnectionStrings__CatalogDb
        - objectName: redis-connection-string
          key: ConnectionStrings__Redis
        - objectName: event-hubs-connection-string
          key: Kafka__Properties__sasl.password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ordering-api-secrets
spec:
  provider: azure
  parameters:
    clientID: <ORDERING_API_MANAGED_IDENTITY_CLIENT_ID>
    keyvaultName: <KEY_VAULT_NAME>
    tenantId: <AZURE_TENANT_ID>
    objects: |
      array:
        - |
          objectName: ordering-db-connection-string
          objectType: secret
        - |
          objectName: event-hubs-connection-string
          objectType: secret
  secretObjects:
    - secretName: ordering-api-secrets
      type: Opaque
      data:
        - objectName: ordering-db-connection-string
          key: ConnectionStrings__OrderingDb
        - objectName: event-hubs-connection-string
          key: Kafka__Properties__sasl.password
