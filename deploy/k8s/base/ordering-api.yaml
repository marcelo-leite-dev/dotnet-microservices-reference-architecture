apiVersion: v1
kind: ServiceAccount
metadata:
  name: ordering-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ordering-api-config
data:
  ASPNETCORE_ENVIRONMENT: Production
  Service__Name: ordering-api
  Kafka__BootstrapServers: kafka:9092
  Kafka__ConsumerGroup: ordering-api
  Database__MigrateOnStartup: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  Services__Catalog__BaseUrl: http://catalog-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering-api
  labels:
    app.kubernetes.io/name: ordering-api
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: ordering-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ordering-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: ordering-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ordering-api
      containers:
        - name: api
          image: ordering-api   # replaced per environment by the overlay's `images:` section
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ordering-api-config
            - secretRef:
                name: ordering-api-secrets   # ConnectionStrings__OrderingDb
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ordering-api
  labels:
    app.kubernetes.io/name: ordering-api
spec:
  selector:
    app.kubernetes.io/name: ordering-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ordering-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ordering-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ordering-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ordering-api
